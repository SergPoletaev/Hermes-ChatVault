name: Validate ChatVault public release

permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Python source and reproducibility tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript tests and syntax
        run: |
          node --check plugin.js
          node --check desktop/plugin.js
          node tests/vault-core.test.mjs
          node tests/vault-i18n.test.mjs
      - name: Publication privacy audit
        run: python scripts/audit_public_release.py
      - name: Unix installer smoke test (isolated temporary Hermes home)
        run: |
          set -eu
          sh -n Install.sh
          sh -n Uninstall.sh
          fake_home="$(mktemp -d)"
          trap 'rm -rf "$fake_home"' EXIT
          sh Install.sh --hermes-home "$fake_home"
          cmp plugin.js "$fake_home/desktop-plugins/hermes-chat-vault/plugin.js"
          sh Install.sh --hermes-home "$fake_home"
          test -n "$(find "$fake_home/desktop-plugins/hermes-chat-vault" -maxdepth 1 -name '*.bak' -print -quit)"
          sh Uninstall.sh --hermes-home "$fake_home"
          test ! -f "$fake_home/desktop-plugins/hermes-chat-vault/plugin.js"
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test Windows installer in temporary Hermes home
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'hermes-fake-home'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          ./Install.ps1 -HermesHome $dir
          $out = Join-Path $dir 'desktop-plugins/hermes-chat-vault/plugin.js'
          if (-not (Test-Path -LiteralPath $out)) { throw 'Plugin missing after install' }
          if ((Get-FileHash -LiteralPath $out).Hash -ne (Get-FileHash -LiteralPath plugin.js).Hash) { throw 'File mismatch' }
          ./Uninstall.ps1 -HermesHome $dir
          if (Test-Path -LiteralPath $out) { throw 'Plugin remained after uninstall' }
